name: MochiForWatch
options:
  bundleIdPrefix: com.museforwatch
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
packages:
  MochiCore:
    path: MochiCore
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: targeted
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    MOCHI_PUSH_ENVIRONMENT: disabled
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: '1'
targets:
  MochiPhone:
    type: application
    platform: iOS
    sources: [iPhone, Shared, Resources/Assets.xcassets]
    dependencies:
      - package: MochiCore
      - target: MochiWatch
        embed: true
    info:
      path: Generated/Phone-Info.plist
      properties:
        CFBundleDisplayName: Mochi for Watch
        MochiPushEnvironment: $(MOCHI_PUSH_ENVIRONMENT)
        NSContactsUsageDescription: Search contacts when you ask Mochi to call someone. Only the name and number you select are shared with your backend for review.
        NSMicrophoneUsageDescription: Talk to Mochi using your microphone. Audio is sent to Meta for transcription.
        NSLocalNetworkUsageDescription: Connect to your Mochi backend on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortraitUpsideDown]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.museforwatch.app
        SUPPORTS_MACCATALYST: NO
  MochiWatch:
    type: application
    platform: watchOS
    sources: [Watch, Shared, Resources/Assets.xcassets]
    dependencies:
      - package: MochiCore
    info:
      path: Generated/Watch-Info.plist
      properties:
        CFBundleDisplayName: Mochi
        MochiPushEnvironment: $(MOCHI_PUSH_ENVIRONMENT)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.museforwatch.app
        WKRunsIndependentlyOfCompanionApp: true
        NSContactsUsageDescription: Search contacts when you ask Mochi to call someone. Only the name and number you select are shared with your backend for review.
        NSMicrophoneUsageDescription: Talk to Mochi using your microphone. Audio is sent to Meta for transcription.
        NSLocalNetworkUsageDescription: Connect to your Mochi backend on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.museforwatch.app.watchkitapp
        TARGETED_DEVICE_FAMILY: '4'
        SKIP_INSTALL: YES
  MochiNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: MochiPhone
      - package: MochiCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.museforwatch.tests
schemes:
  MochiPhone:
    build:
      targets:
        MochiPhone: all
    test:
      targets: [MochiNativeTests]
  MochiWatch:
    build:
      targets:
        MochiWatch: all
