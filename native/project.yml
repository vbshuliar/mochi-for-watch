name: MuseForWatch
options:
  bundleIdPrefix: com.museforwatch
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
packages:
  MuseCore:
    path: MuseCore
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: targeted
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    MUSE_PUSH_ENVIRONMENT: disabled
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: '1'
targets:
  MusePhone:
    type: application
    platform: iOS
    sources: [iPhone, Shared, Resources/Assets.xcassets]
    dependencies:
      - package: MuseCore
      - target: MuseWatch
        embed: true
    info:
      path: Generated/Phone-Info.plist
      properties:
        CFBundleDisplayName: Muse for Watch
        MusePushEnvironment: $(MUSE_PUSH_ENVIRONMENT)
        NSMicrophoneUsageDescription: Talk to Mochi using your microphone. Audio is sent to Meta for transcription.
        NSLocalNetworkUsageDescription: Connect to your Muse backend on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortraitUpsideDown]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.museforwatch.app
        SUPPORTS_MACCATALYST: NO
  MuseWatch:
    type: application
    platform: watchOS
    sources: [Watch, Shared, Resources/Assets.xcassets]
    dependencies:
      - package: MuseCore
    info:
      path: Generated/Watch-Info.plist
      properties:
        CFBundleDisplayName: Muse
        MusePushEnvironment: $(MUSE_PUSH_ENVIRONMENT)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.museforwatch.app
        WKRunsIndependentlyOfCompanionApp: true
        NSMicrophoneUsageDescription: Talk to Mochi using your microphone. Audio is sent to Meta for transcription.
        NSLocalNetworkUsageDescription: Connect to your Muse backend on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.museforwatch.app.watchkitapp
        TARGETED_DEVICE_FAMILY: '4'
        SKIP_INSTALL: YES
  MuseNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: MusePhone
      - package: MuseCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.museforwatch.tests
schemes:
  MusePhone:
    build:
      targets:
        MusePhone: all
    test:
      targets: [MuseNativeTests]
  MuseWatch:
    build:
      targets:
        MuseWatch: all
