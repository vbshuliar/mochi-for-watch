server {
    listen 8080;
    server_name _;
    server_tokens off;
    location = /assets/tuck.png { return 301 https://mochi-for-watch.fly.dev/assets/mochi.png; }
    location = /assets/tuck-face.png { return 301 https://mochi-for-watch.fly.dev/assets/mochi-face.png; }
    location / { return 301 https://mochi-for-watch.fly.dev$request_uri; }
}
