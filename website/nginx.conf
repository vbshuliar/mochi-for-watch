server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

    location = /agent.md {
        types { }
        default_type text/plain;
        charset utf-8;
        limit_except GET { deny all; }
        try_files $uri =404;
    }

    location / {
        limit_except GET { deny all; }
        try_files $uri $uri/ =404;
    }
}
