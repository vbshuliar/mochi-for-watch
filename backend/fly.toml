app = "muse-for-watch-vlad"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "8787"
  APP_MODE = "live"
  DATABASE_PATH = "/data/muse/muse.sqlite"
  META_BASE_URL = "https://api.meta.ai/v1"
  META_MODEL = "muse-spark-1.3"
  CALLS_PUBLIC_URL = "https://muse-for-watch-vlad.fly.dev"
  GMAIL_REDIRECT_URI = "https://muse-for-watch-vlad.fly.dev/oauth/gmail/callback"
  NOTION_REDIRECT_URI = "https://muse-for-watch-vlad.fly.dev/oauth/notion/callback"
  GOOGLE_REDIRECT_URI = "https://muse-for-watch-vlad.fly.dev/oauth/google/callback"

[[mounts]]
  source = "muse_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
